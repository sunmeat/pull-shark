name: Repository audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Summarize repository health files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create audit summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path

          expected = [
              "README.md",
              "LICENSE",
              "CODE_OF_CONDUCT.md",
              "CONTRIBUTING.md",
              "SECURITY.md",
              "ACCESSIBILITY.md",
              "CITATION.cff",
              "SUPPORT.md",
          ]
          print("# Repository audit")
          print()
          print("| Resource | Status |")
          print("|---|---|")
          for name in expected:
              status = "Present" if Path(name).is_file() else "Missing"
              print(f"| `{name}` | {status} |")
          workflows = list(Path(".github/workflows").glob("*.yml")) + list(Path(".github/workflows").glob("*.yaml"))
          print()
          print(f"**GitHub Actions workflows:** {len(set(workflows))}")
          print()
          print(f"**Markdown files:** {len(list(Path('.').rglob('*.md')))}")
          PY