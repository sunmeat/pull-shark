name: Check empty files

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empty-files:
    name: Find accidentally empty tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if [[ -f "$file" && ! -s "$file" ]]; then
              echo "::error file=$file::Tracked file is empty"
              failed=1
            fi
          done < <(git ls-files -z)
          exit "$failed"