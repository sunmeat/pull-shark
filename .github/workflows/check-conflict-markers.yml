name: Check conflict markers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conflict-markers:
    name: Detect accidental conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect changed text files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^ HEAD)"
          else
            changed="$(git ls-files)"
          fi
          failed=0
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            if grep -IqE '^(<<<<<<< |=======|>>>>>>> )' "$file"; then
              echo "::error file=$file::Possible merge conflict marker found"
              failed=1
            fi
          done <<< "$changed"
          exit "$failed"