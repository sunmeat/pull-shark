name: Validate citation metadata

on:
  pull_request:
    paths:
      - 'CITATION.cff'
  push:
    branches: [main]
    paths:
      - 'CITATION.cff'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install cffconvert
      - run: cffconvert --validate --infile CITATION.cff