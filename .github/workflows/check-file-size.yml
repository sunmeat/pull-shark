name: Check file sizes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-size:
    name: Keep tracked files lightweight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked files are under 1 MiB
        shell: bash
        run: |
          limit=$((1024 * 1024))
          failed=0
          while IFS= read -r -d '' file; do
            size=$(wc -c < "$file")
            if (( size > limit )); then
              echo "::error file=$file::File is $size bytes; limit is $limit bytes"
              failed=1
            fi
          done < <(git ls-files -z)
          exit "$failed"