name: Validate YAML

on:
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/workflows/**'
      - '*.yml'
      - '*.yaml'
  push:
    branches: [main]
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/workflows/**'
      - '*.yml'
      - '*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Parse YAML files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install PyYAML
      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = list(Path(".github").rglob("*.yml")) + list(Path(".github").rglob("*.yaml"))
          files += list(Path(".").glob("*.yml")) + list(Path(".").glob("*.yaml"))
          files = sorted(set(files))
          errors = []
          for path in files:
              try:
                  with path.open(encoding="utf-8") as stream:
                      list(yaml.safe_load_all(stream))
              except Exception as error:
                  errors.append(f"{path}: {error}")
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print(f"Validated YAML syntax in {len(files)} files.")
          PY