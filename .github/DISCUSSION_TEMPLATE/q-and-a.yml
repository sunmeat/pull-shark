title: "Question and answer"
body:
  - type: markdown
    attributes:
      value: "Search existing discussions first, then describe the question with enough context for others to help."
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask one clear, focused question.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What have you already read or tried?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would a helpful answer include?
    validations:
      required: false