name: Compatibility report
description: Report a GitHub feature or workflow behaving differently than expected
title: "[Compatibility]: "
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect GitHub to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, or GitHub client, if relevant
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true